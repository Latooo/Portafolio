# Netlify (proyecto "daniellatorre09") también publica este repositorio.
# El sitio se construye con la base /Portafolio (GitHub Pages, https://latooo.github.io/Portafolio/).
# En Netlify el sitio cuelga de la raíz, así que /Portafolio/* se reescribe a /*.
# Si Netlify ya no debe publicar este repo, basta con borrar este archivo y desconectar el proyecto.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.4"

[[redirects]]
  from = "/Portafolio"
  to = "/"
  status = 200

[[redirects]]
  from = "/Portafolio/*"
  to = "/:splat"
  status = 200
