# Despliegue a GitHub Pages con Actions.
#
# Se dispara con cada push a main (y a mano desde la pestaña Actions).
# Requisito: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Si algo sale mal, ver el plan de rollback del repositorio (revertir el merge y
# volver Pages a "Deploy from a branch", main, /).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para configurar y publicar en Pages (y leer el repositorio para el build).
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; el que está en curso no se cancela.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
