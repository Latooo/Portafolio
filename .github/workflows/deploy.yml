# Despliegue a GitHub Pages con Actions. PREPARADO, NO ACTIVADO.
#
# Hoy Pages sirve la rama main directamente ("Deploy from a branch"), y así debe seguir
# hasta que el sitio nuevo esté listo. Este workflow solo se ejecuta a mano (workflow_dispatch).
#
# Para activarlo cuando llegue el momento:
#   1. Repo > Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Descomentar el disparador `push` de abajo (o lanzarlo manualmente desde la pestaña Actions).
# Cambiar la fuente en el paso 1 antes de que main contenga el sitio Astro dejaría el sitio vacío.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
